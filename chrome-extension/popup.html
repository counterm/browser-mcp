<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Page Bridge</title>
<style>
  body { width: 300px; margin: 0; padding: 12px; color: #222;
         font: 13px/1.5 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; }
  .page { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .page img { width: 16px; height: 16px; flex: none; }
  .host { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 10px;
           font-size: 12px; font-weight: 600; }
  .b-black { background: #fdecea; color: #c62828; }
  .b-white { background: #e8f5e9; color: #2e7d32; }
  .b-default { background: #eee; color: #555; }
  .sub { color: #777; font-size: 12px; margin: 6px 0 8px; word-break: break-all; }
  .msg { color: #c62828; font-size: 12px; min-height: 16px; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 10px; }
  button { flex: 1; min-width: 80px; padding: 6px 8px; border: 1px solid #ccc;
           border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; }
  button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
  button.danger { color: #c62828; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #555; }
  .links { margin-top: 10px; display: flex; gap: 12px; }
  .links a { color: #1a73e8; text-decoration: none; font-size: 12px; }
</style>
</head>
<body>
  <div class="page">
    <img id="favicon" alt="">
    <span class="host" id="host">…</span>
  </div>
  <div><span class="badge b-default" id="badge">…</span></div>
  <div class="sub" id="hit"></div>
  <div class="msg" id="msg"></div>
  <div class="btns" id="btns"></div>
  <div class="links">
    <a href="options.html#domains" target="_blank">管理域名列表</a>
    <a href="options.html#regex" target="_blank">管理正则规则</a>
  </div>
  <script src="filter.js"></script>
  <script src="popup.js"></script>
</body>
</html>
