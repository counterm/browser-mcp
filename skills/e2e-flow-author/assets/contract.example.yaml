# 账号管理页字段契约（示例）
# 路径按实际仓库调整；sources 只写文件与行号，不贴大段源码。

page: /system/account
env: production
api:
  create: { method: POST, path: /sys-user }
  list:   { method: GET,  path: /sys-user }
  update: { method: PUT,  path: /sys-user }
  remove: { method: DELETE, path: /sys-user }
table: sys_user
sources:
  ui:  sz-admin/src/views/system/accountManage/components/UserAdd.vue
  api: sz-admin/src/api/modules/system/user.ts
  dto: sz-boot-parent/sz-module/sz-module-admin/src/main/java/com/sz/admin/system/pojo/dto/sysuser/SysUserCreateDTO.java
  ddl: sz-boot-parent/sz-module/sz-module-admin/src/main/resources/db/changelog/framework/2.0.0/tables/024_sys_user.xml
  dict: sz-boot-parent/sz-module/sz-module-common/src/main/java/com/sz/platform/constant/dict/AccountStatusConstant.java

fields:
  username:
    label: 账户
    type: string
    required: true
    pattern: '^\w+$'
    min: 3
    max: 32
    unique: true
    ui: 'input[placeholder="请填写账户"]'
    sources: [ui, dto, ddl]
    notes: 前端 rules 与 DTO 注解一致；DDL VARCHAR(32)
  nickname:
    label: 昵称
    type: string
    required: true
    max: 32
    ui: 'input[placeholder="请填写昵称"]'
    sources: [ui, dto, ddl]
  phone:
    label: 手机号
    type: string
    required: true
    pattern: '^1[3-9]\d{9}$'
    max: 20
    ui: 'input[placeholder="请填写手机号"]'
    sources: [dto, ddl]
    notes: 前端无格式规则；以 DTO @Phone 为准
  email:
    label: 邮箱
    type: string
    format: email
    max: 256
    ui: 'input[placeholder="请填写邮箱地址"]'
    sources: [dto, ddl]
  idCard:
    label: 身份证
    type: string
    format: cn_idcard
    max: 32
    ui: 'input[placeholder="请填写身份证"]'
    sources: [dto, ddl]
  sex:
    label: 性别
    type: enum
    values: [0, 1, 2]
    sources: [ui]
  accountStatusCd:
    label: 账户状态
    type: dict
    dict: account_status
    values: [1000001, 1000002, 1000003]
    sources: [dict]
  deptId:
    label: 部门
    type: ref
    ref: sys_dept.id
    required: false
    sources: [ui, ddl]
