# 新增账号 + 回查（示例）
# 选择器需按真实 DOM 校正；生产环境先确认 env.BASE 指向测试环境还是生产环境。

version: 2
flow: account-create
desc: 用 fixtures 生成唯一账号并回查；运行后按 e2e_ 前缀清理
seed: 20261112

fixtures:
  username: { gen: username, pattern: '^\w+$', min: 3, max: 32, prefix: e2e_, unique: true }
  nickname: { gen: string, prefix: e2e_, length: 10 }
  phone:    { gen: phone, pattern: '^1[3-9]\d{9}$' }
  email:    { gen: email, domain: example.com }
  idCard:   { gen: cn_idcard }
  sex:      { pick: [1, 2] }
  status:   { dict: account_status, values: [1000001], pick: first }

steps:
  - { id: s01, do: nav, url: '${env.BASE}/system/account' }
  - { id: s02, do: click, text: 新增用户, expect: { selector: '.el-dialog' } }
  - { id: s03, do: type, selector: 'input[placeholder="请填写账户"]', text: '${vars.username}' }
  - { id: s04, do: type, selector: 'input[placeholder="请填写昵称"]', text: '${vars.nickname}' }
  - { id: s05, do: type, selector: 'input[placeholder="请填写手机号"]', text: '${vars.phone}' }
  - { id: s06, do: type, selector: 'input[placeholder="请填写邮箱地址"]', text: '${vars.email}' }
  - { id: s07, do: type, selector: 'input[placeholder="请填写身份证"]', text: '${vars.idCard}' }
  - { id: s08, do: click, text: 确定, expect: { text: '新增成功' } }
  - { id: s09, do: type, selector: 'input[placeholder="请填写账户"]', text: '${vars.username}' }
  - { id: s10, do: click, text: 查询, expect: { text: '${vars.username}' } }

# 当前 v2 尚未内置 teardown / extract。
# 清理：在账号列表按 e2e_ 前缀搜索，删除本次创建的记录；或用测试库后置作业清理。
